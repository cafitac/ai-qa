[project]
name = "ai-qa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "jsonschema[format-nongpl]>=4.23"]
[project.scripts]
aiqa = "aiqa.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["aiqa"]
[tool.hatch.build.targets.wheel.force-include]
"schemas" = "aiqa/schemas"
[dependency-groups]
dev = ["ruff>=0.9", "pyright>=1.1.390", "pytest>=8", "types-PyYAML", "types-jsonschema"]
[tool.pyright]
include = ["aiqa"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
[tool.ruff]
extend-exclude = [".dev"]
target-version = "py312"
[tool.pytest.ini_options]
testpaths = ["tests"]
